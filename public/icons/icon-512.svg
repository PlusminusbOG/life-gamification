<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#070a12" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Фон приложения с греческой окантовкой -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)" />
  <rect x="18" y="18" width="476" height="476" rx="90" fill="none" stroke="url(#goldGrad)" stroke-width="6" opacity="0.8" />
  <rect x="30" y="30" width="452" height="452" rx="78" fill="none" stroke="#f59e0b" stroke-width="1.5" opacity="0.3" stroke-dasharray="8 6" />

  <!-- Греческий Спартанский Щит Героя -->
  <g transform="translate(256, 256)" filter="url(#goldGlow)">
    <!-- Внешнее кольцо щита -->
    <circle r="160" fill="#1e1b18" stroke="url(#goldGrad)" stroke-width="12" />
    <circle r="142" fill="none" stroke="#f59e0b" stroke-width="2" opacity="0.6" stroke-dasharray="6 4" />

    <!-- Внутреннее поле щита -->
    <circle r="130" fill="#090d16" />

    <!-- Греческая Лямбда (Λ - Спарта) или Молния Зевса -->
    <path d="M-60 85 L0 -75 L60 85 L35 85 L0 -15 L-35 85 Z" fill="url(#goldGrad)" />

    <!-- Молния Зевса по центру -->
    <path d="M-12 -95 L16 -95 L-6 -20 L24 -20 L-26 105 L-6 10 L-32 10 Z" fill="#fef08a" opacity="0.95" />

    <!-- Звезды Олимпа -->
    <circle cx="0" cy="-115" r="5" fill="#f59e0b" />
    <circle cx="-115" cy="0" r="5" fill="#f59e0b" />
    <circle cx="115" cy="0" r="5" fill="#f59e0b" />
    <circle cx="0" cy="115" r="5" fill="#f59e0b" />
  </g>
</svg>
